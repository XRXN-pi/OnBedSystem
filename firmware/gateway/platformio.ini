; OnBedSystem — Gateway
; gateway      = ใช้งานจริง (อัปโหลดผ่านสาย USB)
; gateway_fake = ทดสอบโดยสร้างข้อมูล node ปลอม (ไม่ต้องมี sensor node)
; gateway_ota  = อัปโหลดผ่าน Wi-Fi (ข้อ E6)

[platformio]
default_envs = gateway

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:gateway]

[env:gateway_fake]
build_flags = -DFAKE_NODES

[env:gateway_ota]
upload_protocol = espota
upload_port = onbed-gateway.local
; รหัส OTA อ่านจาก environment variable ไม่เขียนไว้ในไฟล์ (ดูไฟล์ 03 ขั้นที่ 6)
upload_flags = --auth=${sysenv.OTA_PASSWORD}

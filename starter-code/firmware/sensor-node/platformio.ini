; OnBedSystem — Sensor Node
; เลือก env ที่แถบล่างของ VS Code: wc1 = node ที่ประตู, wc2 = node ที่พื้น

[platformio]
default_envs = wc1

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; WC-1 (ประตู) — KY-032 นับคน + ultrasonic ตรวจว่ามีคนอยู่ในห้อง
[env:wc1]
build_flags = -DNODE_ID=\"WC-1\" -DHAS_BEAM=1 -DHAS_ULTRASONIC=1 -DHAS_LEAK=0

; WC-2 (พื้น) — water level ตรวจพื้นเปียก ส่งทันทีเมื่อสถานะเปลี่ยน
[env:wc2]
build_flags = -DNODE_ID=\"WC-2\" -DHAS_BEAM=0 -DHAS_ULTRASONIC=0 -DHAS_LEAK=1

; OnBedSystem — Sensor Node
; เลือก env ที่แถบล่างของ VS Code: wc1 = node ตัวที่ 1, wc2 = node ตัวที่ 2, calibrate = หาค่า R0

[platformio]
default_envs = wc1

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; WC-1 (ทางเข้า) มีแค่ KY-032 นับคน (HAS_MQ=0)
[env:wc1]
build_flags = -DNODE_ID=\"WC-1\" -DHAS_MQ=0

; WC-2 (โซนโถ) มี MQ-137 + KY-032
; MQ_R0_VALUE = ค่า Rs เฉลี่ยในอากาศสะอาดจาก env:calibrate (แก้หลัง calibrate)
[env:wc2]
build_flags = -DNODE_ID=\"WC-2\" -DHAS_MQ=1 -DMQ_R0_VALUE=1.0f

[env:calibrate]
build_flags = -DNODE_ID=\"CAL\" -DCALIBRATE
